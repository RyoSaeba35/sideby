<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sideby</title>
<style>
  :root { --bg:#ffffff; --fg:#1d2624; --muted:#5b6b67; --accent:#1F5E52; }
  @media (prefers-color-scheme: dark) { :root { --bg:#121816; --fg:#e6eeeb; --muted:#9db0aa; --accent:#9FE3CF; } }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width:640px; margin:0 auto; padding:48px 16px; text-align:center; }
  img { width:120px; height:120px; border-radius:28px; }
  h1 { color:var(--accent); margin:16px 0 4px; }
  p { color:var(--muted); }
  a { color:var(--accent); }
</style>
</head>
<body>
<main>
  <img src="icon.png" alt="Sideby">
  <h1>Sideby</h1>
  <p>Traduction voix et photo, 100 % hors ligne.<br>Offline voice and photo translator.</p>
  <p>中文 · 日本語 · 한국어 · Français · English · Deutsch · Español · Italiano · Nederlands · Polski · Português</p>
  <p><a href="privacy.html">Confidentialité / Privacy</a></p>
</main>
</body>
</html>
