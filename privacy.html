<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sideby privacy policy</title>
<link rel="canonical" href="https://sidebytranslator.com/privacy/">
<meta http-equiv="refresh" content="1; url=https://sidebytranslator.com/privacy/">
<script>
  // Send visitors to the policy in their language when it exists.
  var l = (navigator.language || 'en').slice(0, 2).toLowerCase();
  var langs = ['fr', 'de', 'es', 'it', 'nl', 'pl', 'pt', 'zh', 'ja', 'ko'];
  location.replace('https://sidebytranslator.com/' + (langs.indexOf(l) >= 0 ? l + '/' : '') + 'privacy/');
</script>
</head>
<body>
<p>The privacy policy has moved to <a href="https://sidebytranslator.com/privacy/">sidebytranslator.com/privacy</a>.</p>
</body>
</html>
